name: Switch Duel Cut to TMDB proxy

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'run-tmdb-proxy-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Route TMDB through Cloudflare Worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text()

          old_settings = '''    <h2 class="display">TMDB API Key <span style="color:var(--text-dim);font-weight:400;">(optional)</span></h2>
    <p>Duel Cut already works out of the box. If you'd rather use your own TMDB key instead of the built-in one, grab a free key from
      <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a>
      and paste it below. Leave blank to use the default.</p>
    <input id="api-key-input" type="text" placeholder="Optional — paste your own TMDB API key">
    <div class="row">
      <button class="cancel" id="settings-cancel">Cancel</button>
      <button class="save" id="settings-save">Save</button>
    </div>
'''
          new_settings = '''    <h2 class="display">Settings</h2>
    <div class="row">
      <button class="cancel" id="settings-cancel">Close</button>
    </div>
'''
          if old_settings not in s:
              raise SystemExit('Expected API key settings block not found')
          s = s.replace(old_settings, new_settings, 1)

          old_key_line = "const DEFAULT_API_KEY = 'aa8d690a98a62069774ffbaf2cdc2479';"
          if old_key_line not in s:
              raise SystemExit('Expected hardcoded TMDB key not found')
          s = s.replace(old_key_line, "const TMDB_API_BASE = 'https://duelcut-tmdb-proxy.kiah-harpool.workers.dev';", 1)

          s = s.replace("  apiKey: null,\n  apiKeyOverride: null,\n", "", 1)

          old_init = "  const key = await storageGet('duelcut:api-key');\n  state.apiKeyOverride = key || null;\n  state.apiKey = key || DEFAULT_API_KEY;\n"
          if old_init not in s:
              raise SystemExit('Expected API key init block not found')
          s = s.replace(old_init, "", 1)

          s = s.replace("  if(!state.apiKey) return;\n", "", 1)
          s = s.replace("  el('settings-save').onclick = saveApiKey;\n", "", 1)
          s = s.replace("  el('api-key-input').value = state.apiKeyOverride || '';\n", "", 1)

          s = re.sub(
              r"\nasync function saveApiKey\(\)\{.*?\n\}\n\nasync function runSearch",
              "\nasync function runSearch",
              s,
              count=1,
              flags=re.S,
          )

          s = re.sub(
              r"\n\s*if\(!state\.apiKey\)\{\n\s*el\('search-status'\)\.innerHTML = .*?\n\s*return;\n\s*\}\n",
              "\n",
              s,
              count=1,
              flags=re.S,
          )

          s = re.sub(
              r"\n\s*if\(!state\.apiKey\)\{\n\s*el\('letterboxd-status'\)\.textContent = .*?\n\s*return;\n\s*\}\n",
              "\n",
              s,
              count=1,
              flags=re.S,
          )

          s = s.replace(
              "  const details = state.apiKey ? await fetchMovieDetails(movie.id) : null;",
              "  const details = await fetchMovieDetails(movie.id);",
              1,
          )

          s = s.replace('https://api.themoviedb.org', '${TMDB_API_BASE}')
          s = s.replace('?api_key=${encodeURIComponent(state.apiKey)}&', '?')
          s = s.replace('?api_key=${encodeURIComponent(state.apiKey)}', '')

          forbidden = [
              'aa8d690a98a62069774ffbaf2cdc2479',
              'api.themoviedb.org',
              'state.apiKey',
              'DEFAULT_API_KEY',
              'api-key-input',
              'settings-save',
              'saveApiKey',
              'duelcut:api-key',
              'api_key=',
          ]
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit('Unsafe API key references remain: ' + ', '.join(leftovers))
          if s.count('TMDB_API_BASE') < 5:
              raise SystemExit('Proxy base was not applied to enough TMDB calls')

          path.write_text(s)
          PY

      - name: Commit proxy migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Route TMDB through secure proxy"
          git push
