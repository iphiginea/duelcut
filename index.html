<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131219;
    --surface:#1d1c26;
    --surface-2:#262533;
    --text:#f1efe7;
    --text-dim:#a29fb3;
    --border:#34323f;
    --teal:#4fe0c7;
    --amber:#f2a93b;
    --crimson:#e4463a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;}
  ::selection{background:var(--teal);color:#0b0b10;}

  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #app{max-width:760px;margin:0 auto;padding:20px 16px 80px;}

  header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  header .brand{display:flex;align-items:baseline;gap:10px;}
  header h1{font-size:36px;margin:0;line-height:1;color:var(--text);}
  header .brand small{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:0.14em;}
  #settings-btn{background:none;border:1px solid var(--border);color:var(--text-dim);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;transition:.15s;}
  #settings-btn:hover{border-color:var(--teal);color:var(--teal);}

  nav{display:flex;gap:8px;margin-bottom:24px;}
  nav button{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:12px;border-radius:var(--radius);cursor:pointer;font-family:'IBM Plex Sans';font-weight:600;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;transition:.15s;}
  nav button.active{color:var(--bg);background:var(--teal);border-color:var(--teal);}
  nav button:not(.active):hover{border-color:var(--text-dim);color:var(--text);}

  .hidden{display:none !important;}

  #search-panel{display:flex;flex-direction:column;gap:14px;}
  .search-row{display:flex;gap:8px;}
  .search-row input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:var(--radius);font-size:15px;font-family:'IBM Plex Sans';}
  .search-row input:focus{outline:none;border-color:var(--teal);}
  .search-row button{background:var(--teal);color:#0b0b10;border:none;padding:0 18px;border-radius:var(--radius);font-weight:600;cursor:pointer;font-family:'IBM Plex Sans';}

  #search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;}
  .result-card{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.15s;position:relative;}
  .result-card:hover{border-color:var(--teal);transform:translateY(-2px);}
  .result-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--surface-2);}
  .result-card .placeholder{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-dim);font-size:12px;padding:8px;text-align:center;}
  .result-card .meta{padding:8px;}
  .result-card .meta .t{font-size:13px;font-weight:600;line-height:1.2;}
  .result-card .meta .y{font-size:11px;color:var(--text-dim);}

  .empty-note{color:var(--text-dim);font-size:14px;padding:20px 0;line-height:1.5;}
  .empty-note a{color:var(--teal);}
  .inline-msg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;color:var(--text-dim);}
  .inline-msg.warn{border-color:var(--amber);color:var(--amber);}

  #duel-arena{display:flex;flex-direction:column;gap:18px;}
  .duel-progress{text-align:center;color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:0.12em;}
  .duel-stage{display:flex;align-items:center;gap:0;position:relative;}
  .duel-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;text-align:center;}
  .duel-card:hover{transform:scale(1.02) rotate(var(--tilt));border-color:var(--teal);box-shadow:0 8px 30px rgba(79,224,199,0.15);}
  .duel-card:first-child{--tilt:-1deg;}
  .duel-card:last-child{--tilt:1deg;}
  .duel-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
  .duel-card .placeholder{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-dim);padding:10px;text-align:center;font-size:13px;}
  .duel-card .meta{padding:12px 10px;}
  .duel-card .meta .t{font-weight:600;font-size:14px;line-height:1.25;}
  .duel-card .meta .y{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .vs-divider{width:56px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;}
  .vs-divider span{font-family:'Bebas Neue';font-size:26px;color:var(--crimson);text-shadow:0 0 18px rgba(228,70,58,0.65);}
  @media (max-width:520px){
    .duel-stage{flex-direction:column;}
    .vs-divider{width:100%;height:36px;}
  }

  .confirmation{background:var(--surface);border:1px solid var(--teal);border-radius:var(--radius);padding:24px;text-align:center;}
  .confirmation .rank-number{font-family:'Bebas Neue';font-size:64px;color:var(--teal);line-height:1;}
  .confirmation .rank-out-of{color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.14em;margin-top:2px;}
  .confirmation p{color:var(--text-dim);margin:6px 0 18px;}
  .confirmation button{background:var(--teal);color:#0b0b10;border:none;padding:10px 20px;border-radius:var(--radius);font-weight:600;cursor:pointer;}

  #rankings-list{display:flex;flex-direction:column;gap:8px;}
  .rank-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;position:relative;}
  .rank-row .rank{font-family:'IBM Plex Mono';font-weight:600;font-size:15px;color:var(--text-dim);width:28px;text-align:center;flex:none;}
  .rank-row:nth-child(1) .rank{color:var(--amber);}
  .rank-row:nth-child(2) .rank{color:#cfcfd6;}
  .rank-row:nth-child(3) .rank{color:#c98a4b;}
  .rank-row img{width:38px;height:57px;object-fit:cover;border-radius:4px;flex:none;background:var(--surface-2);}
  .rank-row .placeholder-thumb{width:38px;height:57px;border-radius:4px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:9px;flex:none;text-align:center;}
  .rank-row .info{flex:1;min-width:0;}
  .rank-row .info .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-row .info .y{color:var(--text-dim);font-size:11px;}
  .rank-row .score{font-family:'IBM Plex Mono';font-size:14px;color:var(--teal);flex:none;}
  .rank-row .remove-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;flex:none;padding:4px;}
  .rank-row .remove-btn:hover{color:var(--crimson);}
  .rank-row .rerank-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;flex:none;padding:4px;}
  .rank-row .rerank-btn:hover{color:var(--teal);}
  .rank-row .confirm-remove{display:flex;gap:6px;flex:none;}
  .rank-row .confirm-remove button{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;}
  .rank-row .confirm-remove button.yes{border-color:var(--crimson);color:var(--crimson);}

  #settings-modal{position:fixed;inset:0;background:rgba(10,10,14,0.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;}
  #settings-modal .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;}
  #settings-modal h2{margin:0 0 8px;font-family:'Bebas Neue';font-size:26px;font-weight:400;}
  #settings-modal p{color:var(--text-dim);font-size:13px;line-height:1.5;margin-bottom:14px;}
  #settings-modal a{color:var(--teal);}
  #settings-modal input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-family:'IBM Plex Mono';font-size:13px;margin-bottom:14px;}
  #settings-modal .row{display:flex;gap:8px;justify-content:flex-end;}
  #settings-modal button{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:600;font-size:13px;}
  #settings-modal button.save{background:var(--teal);border-color:var(--teal);color:#0b0b10;}
  #settings-modal button.cancel:hover{border-color:var(--text-dim);}

  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1 class="display">Duel Cut</h1>
      <small>your taste, sorted one duel at a time</small>
    </div>
    <button id="settings-btn" title="Settings">⚙</button>
  </header>

  <nav>
    <button id="tab-log" class="active">Log a Movie</button>
    <button id="tab-rankings">Rankings</button>
  </nav>

  <main>
    <section id="log-view">
      <div id="search-panel">
        <div class="search-row">
          <input id="search-input" type="text" placeholder="Search a movie you've seen…" autocomplete="off">
          <button id="search-btn">Search</button>
        </div>
        <div id="search-status"></div>
        <div id="search-results"></div>
      </div>

      <div id="duel-arena" class="hidden">
        <div class="duel-progress mono" id="duel-progress"></div>
        <div class="duel-stage">
          <div class="duel-card" id="duel-left"></div>
          <div class="vs-divider"><span>VS</span></div>
          <div class="duel-card" id="duel-right"></div>
        </div>
        <div class="inline-msg" style="text-align:center;">Click the one you liked more.</div>
      </div>

      <div id="confirmation-view" class="hidden confirmation">
        <div class="rank-number mono" id="confirm-rank"></div>
        <div class="rank-out-of">out of 10</div>
        <p id="confirm-text"></p>
        <button id="confirm-done">Log another</button>
      </div>
    </section>

    <section id="rankings-view" class="hidden">
      <div id="rankings-list"></div>
    </section>
  </main>
</div>

<div id="settings-modal" class="hidden">
  <div class="box">
    <h2 class="display">TMDB API Key</h2>
    <p>Duel Cut pulls posters and details from The Movie Database. Grab a free API key from
      <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a>
      and paste it below. It's stored only for you.</p>
    <input id="api-key-input" type="text" placeholder="Paste your TMDB API key">
    <div class="row">
      <button class="cancel" id="settings-cancel">Cancel</button>
      <button class="save" id="settings-save">Save</button>
    </div>
  </div>
</div>

<script>
const state = {
  apiKey: null,
  library: [],
  view: 'log',
  pendingMovie: null,
  duelQueue: [],
  duelIndex: 0,
  isRerank: false
};

const el = id => document.getElementById(id);

async function storageGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){ console.error('storage set failed', e); }
}

async function init(){
  const key = await storageGet('duelcut:api-key');
  if(key) state.apiKey = key;
  const lib = await storageGet('duelcut:library');
  if(lib){ try{ state.library = JSON.parse(lib); }catch(e){ state.library = []; } }
  bindEvents();
  renderView();
}

function bindEvents(){
  el('tab-log').onclick = () => { state.view='log'; renderView(); };
  el('tab-rankings').onclick = () => { state.view='rankings'; renderView(); };
  el('settings-btn').onclick = openSettings;
  el('settings-cancel').onclick = closeSettings;
  el('settings-save').onclick = saveApiKey;
  el('search-btn').onclick = runSearch;
  el('search-input').addEventListener('keydown', e => { if(e.key==='Enter') runSearch(); });
  let debounceTimer;
  el('search-input').addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 400);
  });
  el('confirm-done').onclick = resetToSearch;
}

function renderView(){
  el('tab-log').classList.toggle('active', state.view==='log');
  el('tab-rankings').classList.toggle('active', state.view==='rankings');
  el('log-view').classList.toggle('hidden', state.view!=='log');
  el('rankings-view').classList.toggle('hidden', state.view!=='rankings');
  if(state.view==='rankings') renderRankings();
}

function openSettings(){
  el('api-key-input').value = state.apiKey || '';
  el('settings-modal').classList.remove('hidden');
}
function closeSettings(){ el('settings-modal').classList.add('hidden'); }
async function saveApiKey(){
  const val = el('api-key-input').value.trim();
  state.apiKey = val || null;
  await storageSet('duelcut:api-key', val);
  closeSettings();
}

async function runSearch(){
  const query = el('search-input').value.trim();
  el('search-results').innerHTML = '';
  if(!query) { el('search-status').innerHTML=''; return; }
  if(!state.apiKey){
    el('search-status').innerHTML = `<div class="inline-msg warn">Add your TMDB API key first — tap the ⚙ up top.</div>`;
    return;
  }
  el('search-status').innerHTML = `<span class="spinner"></span>`;
  try{
    const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(state.apiKey)}&query=${encodeURIComponent(query)}`);
    if(!res.ok){
      el('search-status').innerHTML = `<div class="inline-msg warn">TMDB rejected that request. Check your API key in settings.</div>`;
      return;
    }
    const data = await res.json();
    el('search-status').innerHTML = '';
    renderSearchResults(data.results || []);
  }catch(e){
    el('search-status').innerHTML = `<div class="inline-msg warn">Couldn't reach TMDB. Try again.</div>`;
  }
}

function posterUrl(path, size){
  return path ? `https://image.tmdb.org/t/p/${size}${path}` : null;
}

function renderSearchResults(results){
  const container = el('search-results');
  container.innerHTML = '';
  if(results.length===0){
    container.innerHTML = `<div class="empty-note">No matches. Try a different title.</div>`;
    return;
  }
  results.slice(0,12).forEach(movie => {
    const already = state.library.find(m => m.id===movie.id);
    const card = document.createElement('div');
    card.className = 'result-card';
    const poster = posterUrl(movie.poster_path, 'w185');
    const year = (movie.release_date||'').slice(0,4) || '—';
    card.innerHTML = `
      ${poster ? `<img src="${poster}" alt="${escapeHtml(movie.title)}">` : `<div class="placeholder">${escapeHtml(movie.title)}</div>`}
      <div class="meta"><div class="t">${escapeHtml(movie.title)}</div><div class="y">${year}${already?' · already logged':''}</div></div>
    `;
    card.onclick = () => selectMovie(movie, already);
    container.appendChild(card);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function selectMovie(movie, already){
  if(already){
    state.view = 'rankings';
    renderView();
    return;
  }
  state.pendingMovie = {
    id: movie.id,
    title: movie.title,
    year: (movie.release_date||'').slice(0,4) || '—',
    poster_path: movie.poster_path,
    elo: 1500
  };
  const opponents = pickOpponents(state.library, 3);
  state.duelQueue = opponents;
  state.duelIndex = 0;
  state.isRerank = false;

  el('search-panel').classList.add('hidden');
  el('confirmation-view').classList.add('hidden');

  if(opponents.length===0){
    finalizeMovie();
    return;
  }
  el('duel-arena').classList.remove('hidden');
  renderDuel();
}

function pickOpponents(library, max){
  if(library.length===0) return [];
  if(library.length<=max) return library.slice();
  const sorted = [...library].sort((a,b)=>b.elo-a.elo);
  const n = sorted.length;
  const idxs = new Set();
  for(let i=0;i<max;i++){
    idxs.add(Math.round(i*(n-1)/(max-1)));
  }
  return [...idxs].map(i=>sorted[i]);
}

function duelCardHtml(movie){
  const poster = posterUrl(movie.poster_path, 'w342');
  return `
    ${poster ? `<img src="${poster}" alt="${escapeHtml(movie.title)}">` : `<div class="placeholder">${escapeHtml(movie.title)}</div>`}
    <div class="meta"><div class="t">${escapeHtml(movie.title)}</div><div class="y">${movie.year}</div></div>
  `;
}

function renderDuel(){
  const opponent = state.duelQueue[state.duelIndex];
  el('duel-progress').textContent = `Duel ${state.duelIndex+1} of ${state.duelQueue.length}`;
  el('duel-left').innerHTML = duelCardHtml(state.pendingMovie);
  el('duel-right').innerHTML = duelCardHtml(opponent);
  el('duel-left').onclick = () => handleDuelChoice(true);
  el('duel-right').onclick = () => handleDuelChoice(false);
}

function expectedScore(a,b){ return 1/(1+Math.pow(10,(b-a)/400)); }

// Converts an Elo rating into a 0-10 power score using the same logistic
// curve as the Elo win-probability math, centered so 1500 = 5.0.
function eloToScore(elo){
  const score = 10/(1+Math.pow(10,-(elo-1500)/400));
  return score.toFixed(1);
}

function handleDuelChoice(pendingWon){
  const K = 32;
  const opponent = state.duelQueue[state.duelIndex];
  const eP = expectedScore(state.pendingMovie.elo, opponent.elo);
  const eO = 1-eP;
  const sP = pendingWon ? 1 : 0;
  const sO = pendingWon ? 0 : 1;
  state.pendingMovie.elo = state.pendingMovie.elo + K*(sP-eP);
  const libOpponent = state.library.find(m=>m.id===opponent.id);
  if(libOpponent) libOpponent.elo = libOpponent.elo + K*(sO-eO);

  state.duelIndex++;
  if(state.duelIndex >= state.duelQueue.length){
    finalizeMovie();
  }else{
    renderDuel();
  }
}

async function finalizeMovie(){
  el('duel-arena').classList.add('hidden');
  if(!state.isRerank){
    state.library.push(state.pendingMovie);
  }
  await storageSet('duelcut:library', JSON.stringify(state.library));
  const sorted = [...state.library].sort((a,b)=>b.elo-a.elo);
  const rank = sorted.findIndex(m=>m.id===state.pendingMovie.id) + 1;
  const score = eloToScore(state.pendingMovie.elo);
  const verb = state.isRerank ? 're-ranked' : 'lands';
  el('confirm-rank').textContent = `${score}`;
  el('confirm-text').textContent = `${state.pendingMovie.title} ${verb} at #${rank} of ${state.library.length}, with a power score of ${score}/10.`;
  state.isRerank = false;
  el('confirmation-view').classList.remove('hidden');
}

function startRerank(movie){
  state.pendingMovie = movie;
  state.isRerank = true;
  const pool = state.library.filter(m => m.id !== movie.id);
  state.duelQueue = pickOpponents(pool, 3);
  state.duelIndex = 0;

  state.view = 'log';
  renderView();
  el('search-panel').classList.add('hidden');
  el('confirmation-view').classList.add('hidden');

  if(state.duelQueue.length === 0){
    finalizeMovie();
    return;
  }
  el('duel-arena').classList.remove('hidden');
  renderDuel();
}

function resetToSearch(){
  state.pendingMovie = null;
  state.duelQueue = [];
  state.duelIndex = 0;
  el('confirmation-view').classList.add('hidden');
  el('search-panel').classList.remove('hidden');
  el('search-input').value = '';
  el('search-results').innerHTML = '';
  el('search-status').innerHTML = '';
}

function renderRankings(){
  const container = el('rankings-list');
  if(state.library.length===0){
    container.innerHTML = `<div class="empty-note">No duels fought yet. Log your first movie to start the ranking.</div>`;
    return;
  }
  const sorted = [...state.library].sort((a,b)=>b.elo-a.elo);
  container.innerHTML = '';
  sorted.forEach((movie, idx) => {
    const row = document.createElement('div');
    row.className = 'rank-row';
    const thumb = posterUrl(movie.poster_path, 'w92');
    row.innerHTML = `
      <div class="rank mono">${idx+1}</div>
      ${thumb ? `<img src="${thumb}" alt="">` : `<div class="placeholder-thumb">${escapeHtml(movie.title.slice(0,2))}</div>`}
      <div class="info">
        <div class="t">${escapeHtml(movie.title)}</div>
        <div class="y">${movie.year}</div>
      </div>
      <div class="score mono">${eloToScore(movie.elo)}</div>
      <button class="rerank-btn" title="Re-rank">↻</button>
      <button class="remove-btn" data-id="${movie.id}" title="Remove">×</button>
    `;
    row.querySelector('.rerank-btn').onclick = () => startRerank(movie);
    row.querySelector('.remove-btn').onclick = (e) => askRemove(row, movie.id);
    container.appendChild(row);
  });
}

function askRemove(row, id){
  const btn = row.querySelector('.remove-btn');
  const wrap = document.createElement('div');
  wrap.className = 'confirm-remove';
  wrap.innerHTML = `<button class="yes">Remove</button><button class="no">Cancel</button>`;
  btn.replaceWith(wrap);
  wrap.querySelector('.yes').onclick = async () => {
    state.library = state.library.filter(m=>m.id!==id);
    await storageSet('duelcut:library', JSON.stringify(state.library));
    renderRankings();
  };
  wrap.querySelector('.no').onclick = () => renderRankings();
}

init();
</script>
</body>
</html>
