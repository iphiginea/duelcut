<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040011;
    --surface:#120b1e;
    --surface-2:#1c1329;
    --text:#f3ecdd;
    --text-dim:#9ca88c;
    --border:#2a2035;
    --teal:#ba0101;
    --amber:#e99d25;
    --crimson:#e0342f;
    --olive:#add794;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;}
  ::selection{background:var(--amber);color:#0b0b10;}
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:760px;margin:0 auto;padding:20px 16px 80px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 20px;border-bottom:1px solid var(--border);margin-bottom:20px;gap:12px;}
  header .brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
  header h1{font-size:36px;margin:0;line-height:1;color:var(--text);white-space:nowrap;}
  header .brand small{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:0.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-icons{display:flex;gap:6px;flex:none;}
  .header-icons button{background:none;border:1px solid var(--border);color:var(--text-dim);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;transition:.15s;display:flex;align-items:center;justify-content:center;padding:0;}
  .header-icons button:hover{border-color:var(--amber);color:var(--amber);}
  @media (max-width:380px){
    header h1{font-size:28px;}
    header .brand small{display:none;}
    .header-icons button{width:32px;height:32px;font-size:13px;}
  }
  nav{display:flex;gap:8px;margin-bottom:24px;}
  nav button{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:12px;border-radius:var(--radius);cursor:pointer;font-family:'IBM Plex Sans';font-weight:600;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;transition:.15s;}
  nav button.active{color:var(--text);background:var(--teal);border-color:var(--teal);}
  nav button:not(.active):hover{border-color:var(--text-dim);color:var(--text);}
  .hidden{display:none !important;}
  #search-panel{display:flex;flex-direction:column;gap:14px;}
  .search-row{display:flex;gap:8px;}
  .search-row input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:var(--radius);font-size:15px;font-family:'IBM Plex Sans';}
  .search-row input:focus{outline:none;border-color:var(--amber);}
  .search-row button{background:var(--teal);color:var(--text);border:none;padding:0 18px;border-radius:var(--radius);font-weight:600;cursor:pointer;font-family:'IBM Plex Sans';}
  #search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;}
  .result-card{display:block;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.15s;position:relative;text-decoration:none;color:inherit;}
  .result-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .result-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--surface-2);}
  .result-card .placeholder{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-dim);font-size:12px;padding:8px;text-align:center;}
  .result-card .meta{padding:8px;}
  .result-card .meta .t{font-size:13px;font-weight:600;line-height:1.2;}
  .result-card .meta .y{font-size:11px;color:var(--text-dim);}
  .empty-note{color:var(--text-dim);font-size:14px;padding:20px 0;line-height:1.5;}
  .empty-note a{color:var(--amber);}
  .inline-msg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;color:var(--text-dim);}
  .inline-msg.warn{border-color:var(--amber);color:var(--amber);}
  #duel-arena{display:flex;flex-direction:column;gap:12px;}
  .duel-progress{text-align:center;color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:0.12em;}
  .duel-stage{display:flex;align-items:flex-start;justify-content:center;gap:0;position:relative;touch-action:none;cursor:grab;will-change:transform;}
  .duel-stage.dragging{cursor:grabbing;}
  .duel-card{flex:1;max-width:44%;display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;text-align:center;}
  .duel-card:hover{transform:scale(1.02) rotate(var(--tilt));border-color:var(--amber);box-shadow:0 8px 30px rgba(233,157,37,0.18);}
  .duel-card.swipe-target{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset, 0 8px 30px rgba(233,157,37,0.35);}
  .duel-card:first-child{--tilt:-1deg;}
  .duel-card:last-child{--tilt:1deg;}
  .duel-card img{height:clamp(150px, 34vh, 260px);width:auto;max-width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
  .duel-card .placeholder{height:clamp(150px, 34vh, 260px);aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-dim);padding:10px;text-align:center;font-size:13px;}
  .duel-card .meta{padding:10px 8px;width:100%;}
  .duel-card .meta .t{font-weight:600;font-size:13px;line-height:1.25;}
  .duel-card .meta .y{color:var(--text-dim);font-size:11px;margin-top:2px;}
  .vs-divider{width:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;align-self:center;}
  .vs-divider span{font-family:'Bebas Neue';font-size:22px;color:var(--crimson);text-shadow:0 0 18px rgba(224,52,47,0.65);}
  .confirmation{background:var(--surface);border:1px solid var(--amber);border-radius:var(--radius);padding:24px;text-align:center;}
  .confirmation .rank-number{font-family:'Bebas Neue';font-size:64px;color:var(--amber);line-height:1;}
  .confirmation .rank-out-of{color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.14em;margin-top:2px;}
  .confirmation p{color:var(--text-dim);margin:6px 0 18px;}
  .confirmation button{background:var(--teal);color:var(--text);border:none;padding:10px 20px;border-radius:var(--radius);font-weight:600;cursor:pointer;}
  #rankings-list{display:flex;flex-direction:column;gap:8px;}
  .rankings-tagline{text-align:center;color:var(--olive);font-size:13px;font-style:italic;margin:0 0 16px;}
  .rankings-search{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:var(--radius);font-size:14px;font-family:'IBM Plex Sans';margin-bottom:14px;}
  .rankings-search:focus{outline:none;border-color:var(--amber);}
  .rankings-search::placeholder{color:var(--text-dim);}
  .view-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .view-toggle button{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
  .view-toggle button.active{background:var(--amber);color:#0b0b10;border-color:var(--amber);}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-row select{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 8px;border-radius:8px;font-size:12px;font-family:'IBM Plex Sans';}
  .filter-row select:focus{outline:none;border-color:var(--amber);}
  .stats-summary{display:flex;gap:10px;margin-bottom:20px;}
  .stat-box{flex:1;background:var(--surface-2);border-radius:8px;padding:14px 8px;text-align:center;}
  .stat-num{font-family:'Bebas Neue';font-size:32px;color:var(--amber);line-height:1;}
  .stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}
  .stats-heading{font-family:'Bebas Neue';font-size:18px;font-weight:400;margin:18px 0 10px;color:var(--text);}
  .stats-bars{display:flex;flex-direction:column;gap:8px;}
  .stats-bar-row{display:flex;align-items:center;gap:8px;font-size:12px;}
  .stats-bar-label{width:90px;flex:none;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stats-bar-track{flex:1;background:var(--surface-2);border-radius:4px;height:10px;overflow:hidden;}
  .stats-bar-fill{height:100%;background:var(--teal);border-radius:4px;}
  .stats-bar-count{width:24px;flex:none;text-align:right;color:var(--text-dim);}
  .random-duel-status{font-size:12px;color:var(--amber);margin-bottom:10px;}
  .tier-row{display:flex;gap:10
