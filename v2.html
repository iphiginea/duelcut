<style>
:root{--bg:#040011;--surface:#120b1e;--surface2:#1c1329;--text:#f3ecdd;--dim:#9ca88c;--border:#2a2035;--red:#ba0101;--amber:#e99d25;--olive:#add794;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.025em}.mono{font-family:'IBM Plex Mono',monospace}.hidden{display:none!important}button,input{font:inherit}button{cursor:pointer}
#app{max-width:780px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 18px;border-bottom:1px solid var(--border);margin-bottom:18px}.brand h1{font-size:34px;line-height:1;margin:0}.brand small{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-top:5px}.ghost{background:none;border:1px solid var(--border);color:var(--dim);border-radius:999px;padding:8px 11px}.ghost:hover{color:var(--text);border-color:var(--amber)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:22px}nav button{border:1px solid var(--border);background:var(--surface);color:var(--dim);border-radius:10px;padding:11px 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}nav button.active{background:var(--red);border-color:var(--red);color:var(--text)}
.kicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--olive);font-weight:600}.section-title{font-family:'Bebas Neue';font-size:24px;font-weight:400;margin:0}.muted{color:var(--dim)}
.confidence-card{border:1px solid var(--border);background:linear-gradient(180deg,var(--surface),rgba(18,11,30,.55));border-radius:16px;padding:18px;margin-bottom:18px}.confidence-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.confidence-number{font-family:'Bebas Neue';font-size:52px;line-height:.9;color:var(--amber)}.confidence-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:3px}.bar{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:14px 0 11px}.bar>i{display:block;height:100%;background:var(--amber);border-radius:inherit}.confidence-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.confidence-meta div{border-top:1px solid var(--border);padding-top:10px}.confidence-meta b{display:block;font-family:'IBM Plex Mono';font-size:15px;color:var(--text)}.confidence-meta span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.block{margin:22px 0}.block-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.block-head p{margin:0;font-size:11px;color:var(--dim)}
.missions{display:grid;gap:8px}.mission{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.mission:hover{border-color:var(--amber)}.mission.completed{opacity:.62}.mission .m-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--olive);margin-bottom:3px}.mission .m-title{font-weight:600;font-size:14px}.mission .m-desc{font-size:11px;color:var(--dim);margin-top:3px}.mission .m-side{text-align:right;min-width:52px}.mission .m-progress{font-family:'IBM Plex Mono';font-size:11px;color:var(--amber)}.mission .m-arrow{display:block;color:var(--amber);font-family:'IBM Plex Mono';margin-top:4px}.mission-bar{height:3px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:9px}.mission-bar i{display:block;height:100%;background:var(--olive);border-radius:inherit}.refresh-cut{margin-top:9px;width:100%;background:none;border:1px solid var(--border);color:var(--amber);border-radius:10px;padding:10px;font-size:11px}
.quick-start{width:100%;background:var(--red);border:1px solid var(--red);border-radius:14px;color:var(--text);padding:17px 18px;text-align:left;display:flex;justify-content:space-between;align-items:center}.quick-start strong{display:block;font-family:'Bebas Neue';font-size:25px;font-weight:400}.quick-start span{display:block;font-size:11px;color:#f4dede;margin-top:2px}.quick-start .arrow{font-family:'IBM Plex Mono';font-size:18px}.mode-chips{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.mode-chip{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 11px;text-align:left}.mode-chip:hover{border-color:var(--amber)}.mode-chip b{display:block;font-size:11px}.mode-chip span{font-size:9px;color:var(--dim);display:block;margin-top:2px}
.reason{text-align:center;padding:3px 8px 8px}.reason .reason-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--olive);font-weight:600}.reason .reason-copy{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.4}.duel-progress{text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:10px}.duel-stage{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;gap:0}.duel-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;color:var(--text);padding:0;text-align:left;transition:.16s;min-width:0}.duel-card:hover{border-color:var(--amber);transform:translateY(-2px)}.duel-card img,.poster-placeholder{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface2);display:block}.poster-placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--dim)}.card-meta{padding:10px}.card-title{font-size:13px;font-weight:600;line-height:1.2}.card-sub{font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-rank{font-family:'IBM Plex Mono';font-size:10px;color:var(--amber);margin-top:7px}.vs{text-align:center;font-family:'Bebas Neue';font-size:19px;color:var(--red)}.duel-actions{display:flex;justify-content:center;gap:8px;margin-top:13px}.duel-actions button{background:none;border:1px solid var(--border);color:var(--dim);border-radius:999px;padding:8px 12px;font-size:11px}.duel-actions button:hover{border-color:var(--amber);color:var(--text)}.duel-actions button:disabled{opacity:.35;cursor:default}
.result-strip{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px;margin-bottom:12px}.result-strip .big{font-family:'Bebas Neue';font-size:24px}.result-strip .small{color:var(--dim);font-size:11px;margin-top:3px}.result-strip .move{font-family:'IBM Plex Mono';color:var(--amber)}
.top10-alert{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;width:min(92vw,520px);background:var(--surface);border:1px solid var(--amber);border-radius:14px;padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none}.top10-alert.show{opacity:1;transform:translate(-50%,0)}.top10-alert .k{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--olive)}.top10-alert .t{font-family:'Bebas Neue';font-size:26px;margin-top:2px}.top10-alert .s{font-size:11px;color:var(--dim)}
.search-row{display:flex;gap:7px;margin:10px 0 14px}.search-row input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text)}.search-row input:focus{outline:none;border-color:var(--amber)}.search-row button{border:0;background:var(--red);color:var(--text);border-radius:10px;padding:0 15px;font-weight:600}.search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}.search-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;padding:0;text-align:left;color:var(--text)}.search-card:hover{border-color:var(--amber)}.search-card:disabled{opacity:.5;cursor:default}.search-card img,.search-card .poster-placeholder{width:100%;aspect-ratio:2/3}.search-card .sm{padding:8px}.search-card .sm b{font-size:12px;display:block}.search-card .sm span{font-size:10px;color:var(--dim)}
.rank-toolbar{display:flex;gap:8px;margin-bottom:4px}.rank-toolbar input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text)}.rank-toolbar input:focus{outline:none;border-color:var(--amber)}.rank-note{font-size:9px;color:var(--dim);margin:7px 0 12px;text-align:right}.ranking-list{display:flex;flex-direction:column}.rank-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:13px 2px;border-bottom:1px solid var(--border);align-items:center}.rank-num{font-family:'Bebas Neue';font-size:27px;color:var(--dim);text-align:center}.rank-row.top .rank-num{color:var(--amber)}.rank-title{font-weight:600;font-size:14px}.rank-sub{font-size:11px;color:var(--dim);margin-top:3px}.rank-stats{text-align:right;white-space:nowrap}.rank-rating{font-family:'IBM Plex Mono';font-size:13px;color:var(--text)}.rank-duels{font-size:10px;color:var(--dim);margin-top:3px}.rank-move{font-family:'IBM Plex Mono';font-size:10px;margin-top:3px}.rank-move.up{color:var(--olive)}.rank-move.down{color:var(--red)}.rank-move.flat{color:var(--dim)}.rank-btn{grid-column:2/4;justify-self:start;background:none;border:0;color:var(--amber);font-size:10px;padding:0;margin-top:-3px}
.library-list{display:grid;gap:8px}.library-row{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.library-row b{font-size:13px}.library-row span{font-size:10px;color:var(--dim)}.library-row button{background:none;border:1px solid var(--border);color:var(--amber);border-radius:999px;font-size:10px;padding:7px 10px}
.modal{position:fixed;inset:0;background:rgba(4,0,17,.86);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:16px}.sheet{width:min(100%,620px);max-height:82vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}.sheet h2{font-family:'Bebas Neue';font-size:28px;font-weight:400;margin:0 0 6px}.sheet p{font-size:12px;color:var(--dim);line-height:1.45}.pick-list{display:grid;gap:6px;margin-top:12px}.pick-list button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;text-align:left}.sheet-close{width:100%;margin-top:14px;background:none;border:1px solid var(--border);color:var(--dim);border-radius:10px;padding:10px}
.empty{padding:22px 4px;color:var(--dim);font-size:13px;line-height:1.5}.status{font-size:11px;color:var(--dim);margin-bottom:10px}
@media(max-width:520px){#app{padding-left:12px;padding-right:12px}.brand h1{font-size:30px}.confidence-meta{grid-template-columns:1fr 1fr}.confidence-meta div:last-child{display:none}.mode-chips{grid-template-columns:1fr 1fr}.duel-stage{grid-template-columns:1fr 28px 1fr}.vs{font-size:16px}.card-meta{padding:8px}.card-title{font-size:12px}.rank-row{grid-template-columns:36px 1fr auto;gap:8px}.rank-num{font-size:23px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><h1 class="display">DUEL CUT</h1><small>your taste, resolved one choice at a time</small></div><button id="homeBtn" class="ghost">Home</button></header>
<nav><button id="tabDuel" class="active">Duel</button><button id="tabRank">Rankings</button><button id="tabLibrary">Library</button></nav>
<main>
<section id="duelView"></section>
<section id="rankView" class="hidden"></section>
<section id="libraryView" class="hidden"></section>
</main>
</div>
<div id="top10Alert" class="top10-alert"><div id="top10Kicker" class="k">New Top 10</div><div id="top10Title" class="t"></div><div id="top10Sub" class="s"></div></div>
<div id="moviePicker" class="modal hidden"><div class="sheet"><h2 id="pickerTitle">Rank a Movie</h2><p id="pickerDesc"></p><div id="pickerList" class="pick-list"></div><button id="pickerClose" class="sheet-close">Close</button></div></div>
<script>
const PROXY='https://duelcut-tmdb-proxy.kiah-harpool.workers.dev/3';
const state={library:[],duelLog:[],totalDuels:0,view:'duel',session:null,lastResult:null,currentCut:[],rankMovement:{}};
const $=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const poster=m=>m?.poster_path?`https://image.tmdb.org/t/p/w500${m.poster_path}`:'';
const clone=v=>JSON.parse(JSON.stringify(v));
function load(){
  try{state.library=JSON.parse(get('duelcut:library')||'[]')}catch(e){state.library=[]}
  try{state.duelLog=JSON.parse(get('duelcut:duellog')||'[]')}catch(e){state.duelLog=[]}
  try{state.currentCut=JSON.parse(get('duelcut:currentcut')||'[]')}catch(e){state.currentCut=[]}
  try{state.rankMovement=JSON.parse(get('duelcut:rankmovement')||'{}')}catch(e){state.rankMovement={}}
  state.totalDuels=parseInt(get('duelcut:totalduels')||'0',10)||0;
  state.library.forEach(m=>{if(typeof m.elo!=='number')m.elo=1500});
  ensureCurrentCut();
  bind();
  render();
}
function save(){
  set('duelcut:library',JSON.stringify(state.library));
  set('duelcut:duellog',JSON.stringify(state.duelLog));
  set('duelcut:totalduels',String(state.totalDuels));
  set('duelcut:currentcut',JSON.stringify(state.currentCut));
  set('duelcut:rankmovement',JSON.stringify(state.rankMovement));
}
function bind(){
  $('tabDuel').onclick=()=>show('duel');
  $('tabRank').onclick=()=>show('rank');
  $('tabLibrary').onclick=()=>show('library');
  $('homeBtn').onclick=()=>{state.session=null;show('duel')};
  $('pickerClose').onclick=()=>$('moviePicker').classList.add('hidden');
  $('moviePicker').onclick=e=>{if(e.target===$('moviePicker'))$('moviePicker').classList.add('hidden')};
}
function show(v){
  state.view=v;
  ['duel','rank','library'].forEach(x=>{$(x+'View').classList.toggle('hidden',x!==v)});
  $('tabDuel').classList.toggle('active',v==='duel');
  $('tabRank').classList.toggle('active',v==='rank');
  $('tabLibrary').classList.toggle('active',v==='library');
  render();
}
function sortedLib(){return [...state.library].sort((a,b)=>(b.elo||1500)-(a.elo||1500))}
function rankMap(){const map={};sortedLib().forEach((m,i)=>map[m.id]=i+1);return map}
function duelCounts(){const c={};state.duelLog.forEach(d=>{c[d.aId]=(c[d.aId]||0)+1;c[d.bId]=(c[d.bId]||0)+1});return c}
function pairKey(a,b){return [Number(a),Number(b)].sort((x,y)=>x-y).join('-')}
function pairStats(){
  const p={};
  state.duelLog.forEach(d=>{
    const k=pairKey(d.aId,d.bId);
    if(!p[k])p[k]={a:Number(d.aId),b:Number(d.bId),aWins:0,bWins:0,count:0,last:0};
    const r=p[k];r.count++;r.last=Math.max(r.last,d.timestamp||0);
    if(Number(d.winnerId)===r.a)r.aWins++;else r.bWins++;
  });
  return p;
}
function confidenceFor(m){
  const counts=duelCounts(),n=counts[m.id]||0,s=sortedLib(),i=s.findIndex(x=>x.id===m.id),g=[];
  if(i>0)g.push(Math.abs(m.elo-s[i-1].elo));if(i<s.length-1)g.push(Math.abs(m.elo-s[i+1].elo));
  const gap=g.length?Math.min(...g):120,duelPart=Math.min(1,n/10),separation=Math.min(1,gap/90);
  return Math.round((duelPart*.72+separation*.28)*100);
}
function overallConfidence(){return state.library.length?Math.round(state.library.reduce((s,m)=>s+confidenceFor(m),0)/state.library.length):0}
function uncertainMovies(){return state.library.map(m=>({m,c:confidenceFor(m)})).sort((a,b)=>a.c-b.c)}
function rivalPairs(){
  const ps=pairStats(),byId=Object.fromEntries(state.library.map(m=>[m.id,m]));
  return Object.values(ps).filter(p=>p.count>=2&&p.aWins>0&&p.bWins>0&&byId[p.a]&&byId[p.b])
    .map(p=>({p,a:byId[p.a],b:byId[p.b],gap:Math.abs(byId[p.a].elo-byId[p.b].elo)}))
    .sort((x,y)=>x.gap-y.gap);
}
function rankingSummary(){
  const counts=duelCounts(),uncertain=state.library.filter(m=>confidenceFor(m)<55).length;
  return {confidence:overallConfidence(),uncertain,underTested:state.library.filter(m=>(counts[m.id]||0)<3).length};
}
function buildCurrentCut(){
  const out=[],s=sortedLib(),counts=duelCounts(),stamp=Date.now();
  if(s.length>=11)out.push({id:`top10-${stamp}`,kind:'top10',label:'Top 10 Audit',title:'Settle your Top 10',target:6,progress:0,completed:false});
  const low=uncertainMovies().find(x=>(counts[x.m.id]||0)<6);
  if(low)out.push({id:`movie-${low.m.id}-${stamp}`,kind:'movie',movieId:low.m.id,label:'Placement',title:`Place ${low.m.title}`,target:5,progress:0,completed:false});
  const rivals=rivalPairs();
  if(rivals.length)out.push({id:`rivals-${stamp}`,kind:'rivals',pairIds:[rivals[0].a.id,rivals[0].b.id],label:'Rivalry',title:`Settle ${rivals[0].a.title} vs. ${rivals[0].b.title}`,target:2,progress:0,completed:false});
  if(out.length<3&&state.library.length>=2)out.push({id:`settle-${stamp}`,kind:'settle',label:'Ranking cleanup',title:'Strengthen uncertain placements',target:6,progress:0,completed:false});
  state.currentCut=out.slice(0,3);
  save();
}
function ensureCurrentCut(){
  if(!Array.isArray(state.currentCut))state.currentCut=[];
  const ids=new Set(state.library.map(m=>Number(m.id)));
  const invalid=state.currentCut.some(m=>(m.movieId&&!ids.has(Number(m.movieId)))||(m.pairIds&&m.pairIds.some(id=>!ids.has(Number(id)))));
  if(!state.currentCut.length||invalid)buildCurrentCut();
}
function missionDesc(m){
  const counts=duelCounts();
  if(m.kind==='top10'){
    const boundary=sortedLib().slice(7,13),shaky=boundary.filter(x=>confidenceFor(x)<75).length;
    return shaky?`${shaky} films near the boundary still need evidence.`:'Pressure-test the #8–#12 boundary.';
  }
  if(m.kind==='movie'){
    const movie=state.library.find(x=>Number(x.id)===Number(m.movieId));
    return movie?`${counts[movie.id]||0} duels · ${confidenceFor(movie)}% confidence`:'Placement mission';
  }
  if(m.kind==='rivals'){
    const a=state.library.find(x=>Number(x.id)===Number(m.pairIds?.[0])),b=state.library.find(x=>Number(x.id)===Number(m.pairIds?.[1]));
    if(a&&b){const ps=pairStats()[pairKey(a.id,b.id)];return ps?`Split history ${ps.aWins}–${ps.bWins} · ${Math.round(Math.abs(a.elo-b.elo))} Elo apart.`:'Resolve the split.'}
  }
  return 'Reduce uncertainty where your ranking needs it most.';
}
function render(){if(state.view==='duel')renderDuelHome();if(state.view==='rank')renderRankings();if(state.view==='library')renderLibrary()}
function resultHtml(){
  if(!state.lastResult)return '';
  const r=state.lastResult,rankMove=r.oldRank===r.newRank?`#${r.newRank} unchanged`:`#${r.oldRank} → #${r.newRank}`;
  return `<div class="result-strip"><div class="big">${esc(r.title)} WINS</div><div class="small"><span class="move">${Math.round(r.oldElo)} → ${Math.round(r.newElo)} Elo</span> · ${rankMove}</div></div>`;
}
function renderDuelHome(){
  const root=$('duelView');if(state.session){renderArena(root);return}
  const s=rankingSummary(),allDone=state.currentCut.length&&state.currentCut.every(m=>m.completed);
  root.innerHTML=`
  ${resultHtml()}
  <div class="confidence-card"><div class="confidence-head"><div><div class="confidence-label">Ranking confidence</div><div class="confidence-number">${s.confidence}%</div></div><div class="muted" style="font-size:11px;text-align:right">${s.confidence<40?'Early read':s.confidence<70?'Taking shape':s.confidence<90?'Mostly settled':'Highly settled'}</div></div><div class="bar"><i style="width:${s.confidence}%"></i></div><div class="confidence-meta"><div><b>${state.library.length}</b><span>films ranked</span></div><div><b>${state.totalDuels}</b><span>duels</span></div><div><b>${s.uncertain}</b><span>uncertain placements</span></div></div></div>
  ${state.currentCut.length?`<div class="block"><div class="block-head"><div><div class="kicker">Current Cut</div><h2 class="section-title">MISSIONS</h2></div><p>${allDone?'Cut complete.':'Persistent until finished.'}</p></div><div class="missions">${state.currentCut.map((m,i)=>`<button class="mission ${m.completed?'completed':''}" data-mission="${i}" ${m.completed?'disabled':''}><div><div class="m-kicker">${esc(m.label)}</div><div class="m-title">${esc(m.title)}</div><div class="m-desc">${esc(missionDesc(m))}</div><div class="mission-bar"><i style="width:${Math.min(100,(m.progress/m.target)*100)}%"></i></div></div><div class="m-side"><div class="m-progress">${m.completed?'DONE':`${m.progress}/${m.target}`}</div>${m.completed?'':`<span class="m-arrow">→</span>`}</div></button>`).join('')}</div>${allDone?'<button id="refreshCut" class="refresh-cut">Build a new Current Cut</button>':''}</div>`:''}
  <div class="block"><div class="block-head"><div><div class="kicker">Start</div><h2 class="section-title">DUEL</h2></div></div>
  <button class="quick-start" data-mode="quick"><div><strong>Quick Duel</strong><span>Ask the most useful question available right now.</span></div><div class="arrow">→</div></button>
  <div class="mode-chips">
    <button class="mode-chip" data-mode="movie"><b>Rank a Movie</b><span>Narrow one film's exact placement.</span></button>
    <button class="mode-chip" data-mode="top10"><b>Top 10 Check</b><span>Pressure-test the boundary.</span></button>
    <button class="mode-chip" data-mode="settle"><b>Settle Ranking</b><span>Target uncertain neighbors.</span></button>
    <button class="mode-chip" data-mode="recent"><b>Recently Watched</b><span>Place newer additions.</span></button>
    <button class="mode-chip" data-mode="rivals"><b>Rivals</b><span>Resolve split decisions.</span></button>
  </div></div>`;
  root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startMode(b.dataset.mode));
  root.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>launchMission(state.currentCut[+b.dataset.mission]));
  const refresh=$('refreshCut');if(refresh)refresh.onclick=()=>{buildCurrentCut();render()};
}
function launchMission(m){
  if(!m||m.completed)return;
  if(m.kind==='movie'){const movie=state.library.find(x=>Number(x.id)===Number(m.movieId));if(movie)startMovieMode(movie,m.id);return}
  if(m.kind==='rivals'&&m.pairIds){const a=state.library.find(x=>Number(x.id)===Number(m.pairIds[0])),b=state.library.find(x=>Number(x.id)===Number(m.pairIds[1]));if(a&&b){startSession('rivals',[a,b],null,m.id);return}}
  startMode(m.kind,m.id);
}
function startMode(mode,missionId=null){
  if(state.library.length<2){show('library');return}
  if(mode==='movie'){openMoviePicker();return}
  const temp={mode,usedPairs:[]},pair=selectPair(mode,temp)||pickAnyClose(temp);
  if(pair)startSession(mode,pair,null,missionId);
}
function startMovieMode(movie,missionId=null){
  if(state.library.length<2||!movie)return;
  const order=sortedLib().filter(m=>Number(m.id)!==Number(movie.id));
  const target=Math.min(7,Math.max(4,Math.ceil(Math.log2(order.length+1))+1));
  const place={orderIds:order.map(m=>m.id),low:0,high:order.length,usedOpponentIds:[]};
  const opp=placementOpponent(place);
  if(opp)startSession('movie',[movie,opp],movie.id,missionId,target,place);
}
function startSession(mode,pair,focalId=null,missionId=null,targetOverride=null,placement=null){
  if(!pair||pair.length<2)return;
  state.lastResult=null;
  const mission=missionId?state.currentCut.find(m=>m.id===missionId):null;
  const remaining=mission?Math.max(1,mission.target-mission.progress):null;
  const defaultTarget=mode==='movie'?6:mode==='top10'?6:mode==='settle'?6:mode==='recent'?5:mode==='rivals'?4:1;
  state.session={mode,pair,step:1,target:remaining||targetOverride||defaultTarget,focalId,missionId,history:[],usedPairs:[],placement};
  render();
}
function usedPair(session,a,b){return session?.usedPairs?.includes(pairKey(a.id,b.id))}
function candidatePairs(pool,session){
  const out=[];
  for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)if(!usedPair(session,pool[i],pool[j]))out.push([pool[i],pool[j]]);
  return out;
}
function scorePair(a,b){
  const ranks=rankMap(),gap=Math.abs((ranks[a.id]||0)-(ranks[b.id]||0)),eloGap=Math.abs(a.elo-b.elo),conf=(confidenceFor(a)+confidenceFor(b))/2,history=pairStats()[pairKey(a.id,b.id)];
  const splitBonus=history&&history.aWins&&history.bWins?-60:0;
  return gap*18+eloGap*.7+conf*.5+splitBonus;
}
function pickSettle(session){
  const u=uncertainMovies().slice(0,Math.min(12,state.library.length)).map(x=>x.m),pairs=candidatePairs(u,session);
  if(pairs.length)return pairs.sort((x,y)=>scorePair(x[0],x[1])-scorePair(y[0],y[1]))[0];
  return null;
}
function pickTop10(session){
  const s=sortedLib(),pool=s.length>=12?s.slice(6,13):s.slice(0,Math.min(10,s.length)),pairs=candidatePairs(pool,session);
  if(!pairs.length)return null;
  const ranks=rankMap();
  return pairs.sort((x,y)=>{
    const boundary=x=>Math.min(Math.abs((ranks[x.id]||99)-10),Math.abs((ranks[x.id]||99)-11));
    return (boundary(x[0])+boundary(x[1]))-(boundary(y[0])+boundary(y[1]))+scorePair(x[0],x[1])*.05-scorePair(y[0],y[1])*.05;
  })[0];
}
function pickRecent(session){
  const recent=state.library.filter(m=>m.addedAt).sort((a,b)=>b.addedAt-a.addedAt).slice(0,8);
  const focal=recent.find(m=>confidenceFor(m)<85)||recent[0];
  if(!focal)return null;
  const pool=sortedLib().filter(m=>m.id!==focal.id&&!usedPair(session,focal,m)).sort((a,b)=>Math.abs(a.elo-focal.elo)-Math.abs(b.elo-focal.elo));
  return pool[0]?[focal,pool[0]]:null;
}
function pickRival(session){
  const rivals=rivalPairs();
  for(const r of rivals)if(!usedPair(session,r.a,r.b))return [r.a,r.b];
  if(rivals.length)return [rivals[0].a,rivals[0].b];
  return null;
}
function pickAnyClose(session){
  const s=sortedLib(),pairs=[];
  for(let i=0;i<s.length-1;i++)if(!usedPair(session,s[i],s[i+1]))pairs.push([s[i],s[i+1]]);
  return pairs.length?pairs.sort((x,y)=>scorePair(x[0],x[1])-scorePair(y[0],y[1]))[0]:s.length>=2?[s[0],s[1]]:null;
}
function selectPair(mode,session){
  if(mode==='top10')return pickTop10(session);
  if(mode==='recent')return pickRecent(session);
  if(mode==='rivals')return pickRival(session);
  if(mode==='settle')return pickSettle(session);
  return pickRival(session)||pickSettle(session)||pickTop10(session)||pickAnyClose(session);
}
function placementOpponent(place){
  if(!place)return null;
  const order=place.orderIds.map(id=>state.library.find(m=>Number(m.id)===Number(id))).filter(Boolean);
  if(!order.length)return null;
  const low=Math.max(0,Math.min(place.low,order.length)),high=Math.max(low,Math.min(place.high,order.length));
  let idx=Math.min(order.length-1,Math.floor((low+high)/2));
  const used=new Set(place.usedOpponentIds.map(Number));
  if(!used.has(Number(order[idx]?.id)))return order[idx];
  for(let d=1;d<order.length;d++){
    const left=idx-d,right=idx+d;
    if(left>=0&&!used.has(Number(order[left].id)))return order[left];
    if(right<order.length&&!used.has(Number(order[right].id)))return order[right];
  }
  return order[idx];
}
function placementRangeText(session){
  if(!session?.placement)return '';
  const n=session.placement.orderIds.length,lo=Math.min(n,session.placement.low)+1,hi=Math.min(n+1,session.placement.high+1);
  if(lo>=hi)return `Placement narrowed to about #${lo}.`;
  return `Placement range is now roughly #${lo}–#${hi}.`;
}
function reasonFor(session,a,b){
  const ranks=rankMap(),gap=Math.abs((ranks[a.id]||0)-(ranks[b.id]||0));
  if(session.mode==='movie'){const focal=state.library.find(m=>Number(m.id)===Number(session.focalId));return ['PLACEMENT',`${placementRangeText(session)} ${focal?`Place ${focal.title} more precisely.`:''}`]}
  if(session.mode==='top10')return ['TOP 10 CHECK',`This matchup tests the #8–#12 boundary.`];
  if(session.mode==='rivals'){const ps=pairStats()[pairKey(a.id,b.id)];return ['RIVALRY',ps&&ps.aWins&&ps.bWins?`You've split this matchup ${ps.aWins}–${ps.bWins}. Settle it.`:'These films remain unusually hard to separate.']}
  if(session.mode==='recent')return ['RECENT WATCH',`Give a newer addition stronger evidence in your ranking.`];
  if(session.mode==='settle')return ['RANKING CLEANUP',gap<=2?`These films are only ${gap||1} position${gap===1?'':'s'} apart.`:`One of these placements has low confidence.`];
  const ps=pairStats()[pairKey(a.id,b.id)];
  if(ps&&ps.aWins&&ps.bWins)return ['RIVALRY',`Your previous choices split this matchup.`];
  if(gap<=2)return ['CLOSE CALL',`Only ${gap||1} ranking position${gap===1?'':'s'} separates these films.`];
  if((ranks[a.id]<=10)!==(ranks[b.id]<=10))return ['TOP 10 CHECK',`A Top 10 position is on the line.`];
  return ['USEFUL MATCHUP',`This comparison will reduce uncertainty in your ranking.`];
}
function renderArena(root){
  const s=state.session,a=s.pair[0],b=s.pair[1],r=reasonFor(s,a,b),rm=rankMap();
  root.innerHTML=`${resultHtml()}<div class="reason"><div class="reason-kicker">${r[0]}</div><div class="reason-copy">${esc(r[1])}</div></div><div class="duel-progress">Duel ${s.step} of ${s.target}</div><div class="duel-stage"><button class="duel-card" id="leftCard">${cardHtml(a,rm[a.id])}</button><div class="vs">VS</div><button class="duel-card" id="rightCard">${cardHtml(b,rm[b.id])}</button></div><div class="duel-actions"><button id="undoBtn" ${s.history.length?'':'disabled'}>Undo</button><button id="exitBtn">End session</button></div>`;
  $('leftCard').onclick=()=>choose(a,b);$('rightCard').onclick=()=>choose(b,a);$('undoBtn').onclick=undo;$('exitBtn').onclick=()=>{state.session=null;render()};
}
function cardHtml(m,rank){
  const p=poster(m);
  return `${p?`<img src="${p}" alt="${esc(m.title)}">`:`<div class="poster-placeholder">${esc(m.title)}</div>`}<div class="card-meta"><div class="card-title">${esc(m.title)}</div><div class="card-sub">${esc(m.year||'—')}${m.director?' · '+esc(m.director):''}</div><div class="card-rank">#${rank||'—'} · ${Math.round(m.elo||1500)} Elo</div></div>`;
}
function updatePlacementBounds(session,winner,loser){
  if(session.mode!=='movie'||!session.placement)return;
  const focalWon=Number(winner.id)===Number(session.focalId),opponent=focalWon?loser:winner,idx=session.placement.orderIds.findIndex(id=>Number(id)===Number(opponent.id));
  if(idx<0)return;
  session.placement.usedOpponentIds.push(opponent.id);
  if(session.placement.low>=session.placement.high)return;
  if(focalWon)session.placement.high=Math.min(session.placement.high,idx);
  else session.placement.low=Math.max(session.placement.low,idx+1);
}
function advanceMissions(session,a,b){
  const before=clone(state.currentCut);
  state.currentCut.forEach(m=>{
    if(m.completed)return;
    let hit=false;
    if(m.kind==='top10'&&session.mode==='top10')hit=true;
    if(m.kind==='settle'&&(session.mode==='settle'||session.mode==='quick'))hit=true;
    if(m.kind==='movie'&&(Number(a.id)===Number(m.movieId)||Number(b.id)===Number(m.movieId)))hit=true;
    if(m.kind==='rivals'&&m.pairIds&&pairKey(a.id,b.id)===pairKey(m.pairIds[0],m.pairIds[1]))hit=true;
    if(hit){m.progress=Math.min(m.target,(m.progress||0)+1);m.completed=m.progress>=m.target}
  });
  return before;
}
function choose(winner,loser){
  const s=state.session,oldRanks=rankMap(),oldElo=winner.elo||1500,oldCut=clone(state.currentCut),oldMovement=clone(state.rankMovement),oldLast=state.lastResult?clone(state.lastResult):null;
  const eW=1/(1+Math.pow(10,((loser.elo||1500)-(winner.elo||1500))/400)),eL=1-eW,K=48;
  const snap={wId:winner.id,lId:loser.id,wE:winner.elo,lE:loser.elo,logLen:state.duelLog.length,total:state.totalDuels,pair:[...s.pair],step:s.step,usedPairs:[...s.usedPairs],placement:s.placement?clone(s.placement):null,currentCut:oldCut,rankMovement:oldMovement,lastResult:oldLast};
  s.history.push(snap);
  s.usedPairs.push(pairKey(winner.id,loser.id));
  winner.elo=(winner.elo||1500)+K*(1-eW);loser.elo=(loser.elo||1500)+K*(0-eL);
  state.duelLog.push({aId:winner.id,aTitle:winner.title,aEloBefore:snap.wE,bId:loser.id,bTitle:loser.title,bEloBefore:snap.lE,winnerId:winner.id,timestamp:Date.now()});
  state.totalDuels++;
  updatePlacementBounds(s,winner,loser);
  advanceMissions(s,winner,loser);
  const newRanks=rankMap();
  state.rankMovement={};
  state.library.forEach(m=>{const from=oldRanks[m.id]||newRanks[m.id],to=newRanks[m.id]||from;state.rankMovement[m.id]={from,to,delta:from-to,ts:Date.now()}});
  const entrants=state.library.filter(m=>(oldRanks[m.id]||999)>10&&(newRanks[m.id]||999)<=10).sort((a,b)=>newRanks[a.id]-newRanks[b.id]);
  if(entrants.length){const m=entrants[0];showTop10(m,oldRanks[m.id],newRanks[m.id])}
  state.lastResult={title:winner.title,oldElo,newElo:winner.elo,oldRank:oldRanks[winner.id]||newRanks[winner.id],newRank:newRanks[winner.id]};
  s.step++;
  save();
  if(s.step>s.target){state.session=null;render();return}
  advancePair();
  render();
}
function advancePair(){
  const s=state.session;
  if(s.mode==='movie'){
    const focal=state.library.find(m=>Number(m.id)===Number(s.focalId)),opp=placementOpponent(s.placement);
    if(focal&&opp){s.pair=[focal,opp];return}
    state.session=null;return;
  }
  const p=selectPair(s.mode,s)||pickAnyClose(s);
  if(p&&p[0].id!==p[1].id){s.pair=p;return}
  state.session=null;
}
function undo(){
  const s=state.session;if(!s||!s.history.length)return;
  const snap=s.history.pop(),w=state.library.find(m=>Number(m.id)===Number(snap.wId)),l=state.library.find(m=>Number(m.id)===Number(snap.lId));
  if(w)w.elo=snap.wE;if(l)l.elo=snap.lE;
  state.duelLog.splice(snap.logLen);state.totalDuels=snap.total;s.pair=snap.pair;s.step=snap.step;s.usedPairs=snap.usedPairs;s.placement=snap.placement;
  state.currentCut=snap.currentCut;state.rankMovement=snap.rankMovement;state.lastResult=snap.lastResult;save();render();
}
function showTop10(movie,from,to){
  $('top10Kicker').textContent=to===1?'NEW #1':'NEW TOP 10';
  $('top10Title').textContent=movie.title;$('top10Sub').textContent=`#${from} → #${to}`;
  const a=$('top10Alert');a.classList.add('show');setTimeout(()=>a.classList.remove('show'),3200);
}
function renderRankings(){
  const root=$('rankView'),counts=duelCounts(),s=sortedLib();
  root.innerHTML=`<div class="block-head"><div><div class="kicker">Your canon</div><h2 class="section-title">RANKINGS</h2></div><p>${s.length} films</p></div><div class="rank-toolbar"><input id="rankSearch" placeholder="Search rankings"></div><div class="rank-note">movement shown from your most recent duel</div><div id="rankingList" class="ranking-list"></div>`;
  const draw=()=>{
    const q=$('rankSearch').value.trim().toLowerCase();
    $('rankingList').innerHTML=s.map((m,i)=>({m,i})).filter(x=>!q||x.m.title.toLowerCase().includes(q)||(x.m.director||'').toLowerCase().includes(q)).map(({m,i})=>{
      const mv=state.rankMovement[m.id]?.delta||0,move=mv>0?`↑${mv}`:mv<0?`↓${Math.abs(mv)}`:'—',cls=mv>0?'up':mv<0?'down':'flat';
      return `<div class="rank-row ${i<10?'top':''}"><div class="rank-num">${String(i+1).padStart(2,'0')}</div><div><div class="rank-title">${esc(m.title)}</div><div class="rank-sub">${esc(m.year||'—')}${m.director?' · '+esc(m.director):''}</div></div><div class="rank-stats"><div class="rank-rating">${Math.round(m.elo||1500)} Elo</div><div class="rank-duels">${counts[m.id]||0} duel${(counts[m.id]||0)===1?'':'s'}</div><div class="rank-move ${cls}">${move}</div></div><button class="rank-btn" data-id="${m.id}">Rank this movie →</button></div>`;
    }).join('')||'<div class="empty">No matches.</div>';
    root.querySelectorAll('.rank-btn').forEach(b=>b.onclick=()=>{const m=state.library.find(x=>Number(x.id)===Number(b.dataset.id));show('duel');startMovieMode(m)});
  };
  draw();$('rankSearch').oninput=draw;
}
function renderLibrary(){
  const root=$('libraryView');
  root.innerHTML=`<div class="block-head"><div><div class="kicker">Add or place</div><h2 class="section-title">LIBRARY</h2></div></div><div class="search-row"><input id="movieSearch" placeholder="I watched something…"><button id="movieSearchBtn">Search</button></div><div id="searchStatus" class="status"></div><div id="searchResults" class="search-results"></div>${state.library.length?`<div class="block"><div class="kicker">Needs more evidence</div><div class="library-list">${uncertainMovies().slice(0,6).map(x=>`<div class="library-row"><div><b>${esc(x.m.title)}</b><br><span>${x.c}% confidence · ${Math.round(x.m.elo)} Elo</span></div><button data-place="${x.m.id}">Place movie</button></div>`).join('')}</div></div>`:''}`;
  $('movieSearchBtn').onclick=searchMovies;$('movieSearch').onkeydown=e=>{if(e.key==='Enter')searchMovies()};
  root.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const m=state.library.find(x=>Number(x.id)===Number(b.dataset.place));show('duel');startMovieMode(m)});
}
async function searchMovies(){
  const q=$('movieSearch').value.trim();if(!q)return;$('searchStatus').textContent='Searching…';$('searchResults').innerHTML='';
  try{
    const res=await fetch(`${PROXY}/search/movie?api_key=proxy&query=${encodeURIComponent(q)}&include_adult=false`),data=await res.json();
    $('searchStatus').textContent='';
    $('searchResults').innerHTML=(data.results||[]).slice(0,12).map(m=>{
      const exists=state.library.some(x=>Number(x.id)===Number(m.id)),p=m.poster_path?`https://image.tmdb.org/t/p/w342${m.poster_path}`:'';
      return `<button class="search-card" data-id="${m.id}" ${exists?'disabled':''}>${p?`<img src="${p}" alt="${esc(m.title)}">`:`<div class="poster-placeholder">${esc(m.title)}</div>`}<div class="sm"><b>${esc(m.title)}</b><span>${(m.release_date||'').slice(0,4)||'—'}${exists?' · already ranked':''}</span></div></button>`;
    }).join('');
    $('searchResults').querySelectorAll('[data-id]:not([disabled])').forEach(b=>b.onclick=()=>addMovieFromSearch((data.results||[]).find(m=>Number(m.id)===Number(b.dataset.id))));
  }catch(e){$('searchStatus').textContent='Search failed. Try again.'}
}
async function addMovieFromSearch(m){
  $('searchStatus').textContent=`Loading ${m.title}…`;let details={};
  try{const r=await fetch(`${PROXY}/movie/${m.id}?api_key=proxy&append_to_response=credits`),d=await r.json(),director=(d.credits?.crew||[]).find(c=>c.job==='Director');details={runtime:d.runtime||null,director:director?.name||null}}catch(e){}
  const movie={id:m.id,title:m.title,year:(m.release_date||'').slice(0,4)||'—',poster_path:m.poster_path,elo:1500,genres:m.genre_ids||[],tmdbRating:typeof m.vote_average==='number'?m.vote_average:null,addedAt:Date.now(),rerankCount:0,...details};
  state.library.push(movie);ensureCurrentCut();save();$('searchStatus').textContent='';show('duel');startMovieMode(movie);
}
function openMoviePicker(){
  $('pickerTitle').textContent='Rank a Movie';$('pickerDesc').textContent='Choose one film. Duel Cut will start broad, narrow the range, then compare locally.';
  $('pickerList').innerHTML=sortedLib().map(m=>`<button data-id="${m.id}"><b>${esc(m.title)}</b><br><span class="muted">${esc(m.year||'—')} · ${confidenceFor(m)}% confidence</span></button>`).join('');
  $('moviePicker').classList.remove('hidden');
  $('pickerList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const m=state.library.find(x=>Number(x.id)===Number(b.dataset.id));$('moviePicker').classList.add('hidden');startMovieMode(m)});
}
load();
</script>
