<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Duel Cut — V2</title>
<meta name="theme-color" content="#040011">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#040011;--surface:#120b1e;--surface2:#1c1329;--text:#f3ecdd;--dim:#9ca88c;--border:#2a2035;--red:#ba0101;--amber:#e99d25;--olive:#add794;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.025em}.mono{font-family:'IBM Plex Mono',monospace}.hidden{display:none!important}button,input{font:inherit}button{cursor:pointer}
#app{max-width:780px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 18px;border-bottom:1px solid var(--border);margin-bottom:18px}.brand h1{font-size:34px;line-height:1;margin:0}.brand small{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-top:5px}.ghost{background:none;border:1px solid var(--border);color:var(--dim);border-radius:999px;padding:8px 11px}.ghost:hover{color:var(--text);border-color:var(--amber)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:22px}nav button{border:1px solid var(--border);background:var(--surface);color:var(--dim);border-radius:10px;padding:11px 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}nav button.active{background:var(--red);border-color:var(--red);color:var(--text)}
.kicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--olive);font-weight:600}.section-title{font-family:'Bebas Neue';font-size:24px;font-weight:400;margin:0}.muted{color:var(--dim)}
.confidence-card{border:1px solid var(--border);background:linear-gradient(180deg,var(--surface),rgba(18,11,30,.55));border-radius:16px;padding:18px;margin-bottom:18px}.confidence-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.confidence-number{font-family:'Bebas Neue';font-size:52px;line-height:.9;color:var(--amber)}.confidence-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:3px}.bar{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:14px 0 11px}.bar>i{display:block;height:100%;background:var(--amber);border-radius:inherit}.confidence-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.confidence-meta div{border-top:1px solid var(--border);padding-top:10px}.confidence-meta b{display:block;font-family:'IBM Plex Mono';font-size:15px;color:var(--text)}.confidence-meta span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.block{margin:22px 0}.block-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.block-head p{margin:0;font-size:11px;color:var(--dim)}
.missions{display:grid;gap:8px}.mission{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.mission:hover{border-color:var(--amber)}.mission .m-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--olive);margin-bottom:3px}.mission .m-title{font-weight:600;font-size:14px}.mission .m-desc{font-size:11px;color:var(--dim);margin-top:3px}.mission .m-arrow{color:var(--amber);font-family:'IBM Plex Mono'}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{min-height:112px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;color:var(--text);position:relative}.mode:hover{border-color:var(--amber);transform:translateY(-1px)}.mode strong{display:block;font-family:'Bebas Neue';font-size:20px;font-weight:400;letter-spacing:.02em;margin-bottom:4px}.mode span{display:block;color:var(--dim);font-size:11px;line-height:1.35}.mode.primary{grid-column:1/-1;background:var(--red);border-color:var(--red)}.mode.primary span{color:#f4dede}.mode .mode-num{position:absolute;right:12px;top:10px;font-family:'IBM Plex Mono';font-size:10px;color:var(--dim)}.mode.primary .mode-num{color:#f4dede}
.reason{text-align:center;padding:3px 8px 8px}.reason .reason-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--olive);font-weight:600}.reason .reason-copy{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.4}.duel-progress{text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:10px}.duel-stage{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;gap:0}.duel-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;color:var(--text);padding:0;text-align:left;transition:.16s;min-width:0}.duel-card:hover{border-color:var(--amber);transform:translateY(-2px)}.duel-card img,.poster-placeholder{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface2);display:block}.poster-placeholder{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--dim)}.card-meta{padding:10px}.card-title{font-size:13px;font-weight:600;line-height:1.2}.card-sub{font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-rank{font-family:'IBM Plex Mono';font-size:10px;color:var(--amber);margin-top:7px}.vs{text-align:center;font-family:'Bebas Neue';font-size:19px;color:var(--red)}.duel-actions{display:flex;justify-content:center;gap:8px;margin-top:13px}.duel-actions button{background:none;border:1px solid var(--border);color:var(--dim);border-radius:999px;padding:8px 12px;font-size:11px}.duel-actions button:hover{border-color:var(--amber);color:var(--text)}
.result-strip{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px;margin-bottom:12px}.result-strip .big{font-family:'Bebas Neue';font-size:24px}.result-strip .small{color:var(--dim);font-size:11px;margin-top:2px}.top10-alert{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;width:min(92vw,520px);background:var(--surface);border:1px solid var(--amber);border-radius:14px;padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none}.top10-alert.show{opacity:1;transform:translate(-50%,0)}.top10-alert .k{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--olive)}.top10-alert .t{font-family:'Bebas Neue';font-size:26px;margin-top:2px}.top10-alert .s{font-size:11px;color:var(--dim)}
.search-row{display:flex;gap:7px;margin:10px 0 14px}.search-row input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text)}.search-row input:focus{outline:none;border-color:var(--amber)}.search-row button{border:0;background:var(--red);color:var(--text);border-radius:10px;padding:0 15px;font-weight:600}.search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}.search-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;padding:0;text-align:left;color:var(--text)}.search-card:hover{border-color:var(--amber)}.search-card img,.search-card .poster-placeholder{width:100%;aspect-ratio:2/3}.search-card .sm{padding:8px}.search-card .sm b{font-size:12px;display:block}.search-card .sm span{font-size:10px;color:var(--dim)}
.rank-toolbar{display:flex;gap:8px;margin-bottom:12px}.rank-toolbar input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text)}.rank-toolbar input:focus{outline:none;border-color:var(--amber)}.ranking-list{display:flex;flex-direction:column}.rank-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:13px 2px;border-bottom:1px solid var(--border);align-items:center}.rank-num{font-family:'Bebas Neue';font-size:27px;color:var(--dim);text-align:center}.rank-row.top .rank-num{color:var(--amber)}.rank-title{font-weight:600;font-size:14px}.rank-sub{font-size:11px;color:var(--dim);margin-top:3px}.rank-stats{text-align:right;white-space:nowrap}.rank-rating{font-family:'IBM Plex Mono';font-size:13px;color:var(--text)}.rank-duels{font-size:10px;color:var(--dim);margin-top:3px}.rank-btn{grid-column:2/4;justify-self:start;background:none;border:0;color:var(--amber);font-size:10px;padding:0;margin-top:-3px}
.library-list{display:grid;gap:8px}.library-row{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.library-row b{font-size:13px}.library-row span{font-size:10px;color:var(--dim)}.library-row button{background:none;border:1px solid var(--border);color:var(--amber);border-radius:999px;font-size:10px;padding:7px 10px}
.modal{position:fixed;inset:0;background:rgba(4,0,17,.86);z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:16px}.sheet{width:min(100%,620px);max-height:82vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px}.sheet h2{font-family:'Bebas Neue';font-size:28px;font-weight:400;margin:0 0 6px}.sheet p{font-size:12px;color:var(--dim);line-height:1.45}.pick-list{display:grid;gap:6px;margin-top:12px}.pick-list button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;text-align:left}.sheet-close{width:100%;margin-top:14px;background:none;border:1px solid var(--border);color:var(--dim);border-radius:10px;padding:10px}
.empty{padding:22px 4px;color:var(--dim);font-size:13px;line-height:1.5}.status{font-size:11px;color:var(--dim);margin-bottom:10px}
@media(max-width:520px){#app{padding-left:12px;padding-right:12px}.brand h1{font-size:30px}.confidence-meta{grid-template-columns:1fr 1fr}.confidence-meta div:last-child{display:none}.mode-grid{grid-template-columns:1fr}.mode.primary{grid-column:auto}.duel-stage{grid-template-columns:1fr 28px 1fr}.vs{font-size:16px}.card-meta{padding:8px}.card-title{font-size:12px}.rank-row{grid-template-columns:36px 1fr auto;gap:8px}.rank-num{font-size:23px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><h1 class="display">DUEL CUT</h1><small>your taste, resolved one choice at a time</small></div><button id="homeBtn" class="ghost">Home</button></header>
<nav><button id="tabDuel" class="active">Duel</button><button id="tabRank">Rankings</button><button id="tabLibrary">Library</button></nav>
<main>
<section id="duelView"></section>
<section id="rankView" class="hidden"></section>
<section id="libraryView" class="hidden"></section>
</main>
</div>
<div id="top10Alert" class="top10-alert"><div class="k">New Top 10</div><div id="top10Title" class="t"></div><div id="top10Sub" class="s"></div></div>
<div id="moviePicker" class="modal hidden"><div class="sheet"><h2 id="pickerTitle">Rank a Movie</h2><p id="pickerDesc"></p><div id="pickerList" class="pick-list"></div><button id="pickerClose" class="sheet-close">Close</button></div></div>
<script>
const PROXY='https://duelcut-tmdb-proxy.kiah-harpool.workers.dev/3';
const state={library:[],duelLog:[],totalDuels:0,view:'duel',session:null,lastResult:null};
const $=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const poster=m=>m?.poster_path?`https://image.tmdb.org/t/p/w500${m.poster_path}`:'';
function load(){try{state.library=JSON.parse(get('duelcut:library')||'[]')}catch(e){state.library=[]}try{state.duelLog=JSON.parse(get('duelcut:duellog')||'[]')}catch(e){state.duelLog=[]}state.totalDuels=parseInt(get('duelcut:totalduels')||'0',10)||0;bind();render();}
function save(){set('duelcut:library',JSON.stringify(state.library));set('duelcut:duellog',JSON.stringify(state.duelLog));set('duelcut:totalduels',String(state.totalDuels));}
function bind(){$('tabDuel').onclick=()=>show('duel');$('tabRank').onclick=()=>show('rank');$('tabLibrary').onclick=()=>show('library');$('homeBtn').onclick=()=>{state.session=null;state.lastResult=null;show('duel')};$('pickerClose').onclick=()=>$('moviePicker').classList.add('hidden');$('moviePicker').onclick=e=>{if(e.target===$('moviePicker'))$('moviePicker').classList.add('hidden')};}
function show(v){state.view=v;['duel','rank','library'].forEach(x=>{$(x+'View').classList.toggle('hidden',x!==v)});$('tabDuel').classList.toggle('active',v==='duel');$('tabRank').classList.toggle('active',v==='rank');$('tabLibrary').classList.toggle('active',v==='library');render();}
function rankMap(){const map={};[...state.library].sort((a,b)=>b.elo-a.elo).forEach((m,i)=>map[m.id]=i+1);return map;}
function duelCounts(){const c={};state.duelLog.forEach(d=>{c[d.aId]=(c[d.aId]||0)+1;c[d.bId]=(c[d.bId]||0)+1});return c;}
function pairKey(a,b){return [a,b].sort((x,y)=>x-y).join('-')}
function pairStats(){const p={};state.duelLog.forEach(d=>{const k=pairKey(d.aId,d.bId);if(!p[k])p[k]={a:d.aId,b:d.bId,aWins:0,bWins:0,count:0,last:0};const r=p[k];r.count++;r.last=Math.max(r.last,d.timestamp||0);if(d.winnerId===r.a)r.aWins++;else r.bWins++});return p;}
function confidenceFor(m){const counts=duelCounts();const n=counts[m.id]||0;const sorted=[...state.library].sort((a,b)=>b.elo-a.elo);const i=sorted.findIndex(x=>x.id===m.id);const neighborGaps=[];if(i>0)neighborGaps.push(Math.abs(m.elo-sorted[i-1].elo));if(i<sorted.length-1)neighborGaps.push(Math.abs(m.elo-sorted[i+1].elo));const gap=neighborGaps.length?Math.min(...neighborGaps):120;const duelPart=Math.min(1,n/10);const separation=Math.min(1,gap/90);return Math.round((duelPart*.72+separation*.28)*100)}
function overallConfidence(){if(!state.library.length)return 0;return Math.round(state.library.reduce((s,m)=>s+confidenceFor(m),0)/state.library.length)}
function uncertainMovies(){return [...state.library].map(m=>({m,c:confidenceFor(m)})).sort((a,b)=>a.c-b.c)}
function rivalPairs(){const ps=pairStats(), byId=Object.fromEntries(state.library.map(m=>[m.id,m]));return Object.values(ps).filter(p=>p.count>=2&&p.aWins>0&&p.bWins>0&&byId[p.a]&&byId[p.b]).map(p=>({p,a:byId[p.a],b:byId[p.b],gap:Math.abs(byId[p.a].elo-byId[p.b].elo)})).sort((x,y)=>x.gap-y.gap)}
function rankingSummary(){const counts=duelCounts();const uncertain=state.library.filter(m=>confidenceFor(m)<55).length;return {confidence:overallConfidence(),uncertain,underTested:state.library.filter(m=>(counts[m.id]||0)<3).length}}
function missions(){const out=[];const sorted=[...state.library].sort((a,b)=>b.elo-a.elo);const counts=duelCounts();if(sorted.length>=11){const boundary=sorted.slice(7,13);const shaky=boundary.filter(m=>confidenceFor(m)<75).length;out.push({kind:'top10',label:'Top 10 Audit',title:'Settle your Top 10',desc:shaky?`${shaky} films near the boundary still need evidence.`:'Pressure-test the #8–#12 boundary.'})}const low=uncertainMovies().find(x=>(counts[x.m.id]||0)<5);if(low)out.push({kind:'movie',movie:low.m,label:'Placement',title:`Place ${low.m.title}`,desc:`${counts[low.m.id]||0} duels · ${low.c}% confidence`});const rivals=rivalPairs();if(rivals.length)out.push({kind:'rivals',label:'Rivalry',title:`Settle ${rivals[0].a.title} vs. ${rivals[0].b.title}`,desc:`Split history · only ${Math.round(rivals[0].gap)} Elo apart.`});if(!out.length&&state.library.length>=2)out.push({kind:'settle',label:'Ranking cleanup',title:'Strengthen your ranking',desc:'Duel the least certain relationships next.'});return out.slice(0,3)}
function render(){if(state.view==='duel')renderDuelHome();if(state.view==='rank')renderRankings();if(state.view==='library')renderLibrary();}
function renderDuelHome(){const root=$('duelView');if(state.session){renderArena(root);return}const s=rankingSummary(), ms=missions();root.innerHTML=`
${state.lastResult?`<div class="result-strip"><div class="big">${esc(state.lastResult.title)} ${state.lastResult.win?'WINS':'UPDATED'}</div><div class="small">${state.lastResult.delta>=0?'+':''}${state.lastResult.delta} Elo · now #${state.lastResult.rank}</div></div>`:''}
<div class="confidence-card"><div class="confidence-head"><div><div class="confidence-label">Ranking confidence</div><div class="confidence-number">${s.confidence}%</div></div><div class="muted" style="font-size:11px;text-align:right">${s.confidence<40?'Early read':s.confidence<70?'Taking shape':s.confidence<90?'Mostly settled':'Highly settled'}</div></div><div class="bar"><i style="width:${s.confidence}%"></i></div><div class="confidence-meta"><div><b>${state.library.length}</b><span>films ranked</span></div><div><b>${state.totalDuels}</b><span>duels</span></div><div><b>${s.uncertain}</b><span>uncertain placements</span></div></div></div>
${ms.length?`<div class="block"><div class="block-head"><div><div class="kicker">Today's Cut</div><h2 class="section-title">MISSIONS</h2></div><p>Useful work, not busywork.</p></div><div class="missions">${ms.map((m,i)=>`<button class="mission" data-mission="${i}"><div><div class="m-kicker">${esc(m.label)}</div><div class="m-title">${esc(m.title)}</div><div class="m-desc">${esc(m.desc)}</div></div><div class="m-arrow">→</div></button>`).join('')}</div></div>`:''}
<div class="block"><div class="block-head"><div><div class="kicker">Choose your cut</div><h2 class="section-title">DUEL MODES</h2></div></div><div class="mode-grid">
<button class="mode primary" data-mode="quick"><span class="mode-num">01</span><strong>Quick Duel</strong><span>Ask the most useful question available right now.</span></button>
<button class="mode" data-mode="settle"><span class="mode-num">02</span><strong>Settle My Ranking</strong><span>Prioritize uncertain neighbors and weak placements.</span></button>
<button class="mode" data-mode="movie"><span class="mode-num">03</span><strong>Rank a Movie</strong><span>Choose one film and sharpen exactly where it belongs.</span></button>
<button class="mode" data-mode="top10"><span class="mode-num">04</span><strong>Top 10 Check</strong><span>Pressure-test the boundary around your highest-ranked films.</span></button>
<button class="mode" data-mode="recent"><span class="mode-num">05</span><strong>Recently Watched</strong><span>Place the newest films in your library.</span></button>
<button class="mode" data-mode="rivals"><span class="mode-num">06</span><strong>Rivals</strong><span>Resolve pairs your own choices keep splitting.</span></button>
</div></div>`;
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startMode(b.dataset.mode));root.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>launchMission(ms[+b.dataset.mission]));}
function launchMission(m){if(m.kind==='movie')startMovieMode(m.movie);else startMode(m.kind)}
function startMode(mode){if(state.library.length<2){show('library');return}if(mode==='movie'){openMoviePicker();return}let pair=null;if(mode==='top10')pair=pickTop10();else if(mode==='recent')pair=pickRecent();else if(mode==='rivals')pair=pickRival();else if(mode==='settle')pair=pickSettle();else pair=pickSmart();if(!pair){pair=pickSmart()}startSession(mode,pair)}
function startMovieMode(movie){if(state.library.length<2)return;const opp=bestOpponentFor(movie);if(!opp)return;startSession('movie',[movie,opp],movie.id)}
function startSession(mode,pair,focalId=null){if(!pair||pair.length<2)return;state.lastResult=null;state.session={mode,pair,step:1,target:mode==='movie'?6:mode==='top10'?6:mode==='settle'?8:mode==='recent'?5:mode==='rivals'?4:1,focalId,history:[]};render()}
function sortedLib(){return [...state.library].sort((a,b)=>b.elo-a.elo)}
function bestOpponentFor(movie){const pool=state.library.filter(m=>m.id!==movie.id);if(!pool.length)return null;return pool.sort((a,b)=>Math.abs(a.elo-movie.elo)-Math.abs(b.elo-movie.elo))[0]}
function pickSmart(){return pickSettle()||pickRival()||pickTop10()||pickRandomClose()}
function pickSettle(){const u=uncertainMovies();if(!u.length)return null;const first=u[0].m;const opp=bestOpponentFor(first);return opp?[first,opp]:null}
function pickTop10(){const s=sortedLib();if(s.length<2)return null;const pool=s.length>=11?s.slice(7,12):s.slice(0,Math.min(10,s.length));let best=null;for(let i=0;i<pool.length-1;i++){const a=pool[i],b=pool[i+1],score=Math.abs(a.elo-b.elo)+confidenceFor(a)+confidenceFor(b);if(!best||score<best.score)best={a,b,score}}return best?[best.a,best.b]:[pool[0],pool[1]]}
function pickRecent(){const recent=[...state.library].sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)).slice(0,6);const focal=recent.find(m=>confidenceFor(m)<85)||recent[0];const opp=bestOpponentFor(focal);return opp?[focal,opp]:null}
function pickRival(){const r=rivalPairs()[0];return r?[r.a,r.b]:null}
function pickRandomClose(){const s=sortedLib();if(s.length<2)return null;let best=[];for(let i=0;i<s.length-1;i++)best.push([s[i],s[i+1]]);return best[Math.floor(Math.random()*best.length)]}
function reasonFor(session,a,b){const ranks=rankMap(), gap=Math.abs((ranks[a.id]||0)-(ranks[b.id]||0));if(session.mode==='movie')return ['PLACEMENT',`Each choice narrows where ${a.id===session.focalId?a.title:b.title} belongs.`];if(session.mode==='top10')return ['TOP 10 CHECK',`${ranks[a.id]<=10?'#'+ranks[a.id]:'#'+ranks[b.id]} is defending the Top 10 boundary.`];if(session.mode==='rivals'){const ps=pairStats()[pairKey(a.id,b.id)];return ['RIVALRY',ps?`You've split this matchup ${ps.aWins}–${ps.bWins}. Settle it.`:'Your ranking keeps these two close.'];}if(session.mode==='recent')return ['RECENT WATCH',`Give a newer addition stronger evidence in your ranking.`];if(session.mode==='settle')return ['RANKING CLEANUP',gap<=2?`These films are only ${gap||1} position${gap===1?'':'s'} apart.`:`One of these placements has low confidence.`];const ps=pairStats()[pairKey(a.id,b.id)];if(ps&&ps.count>=2&&ps.aWins&&ps.bWins)return ['RIVALRY',`Your previous choices split this matchup.`];if(gap<=2)return ['CLOSE CALL',`Only ${gap||1} ranking position${gap===1?'':'s'} separates these films.`];if((ranks[a.id]<=10)!==(ranks[b.id]<=10))return ['TOP 10 CHECK',`A Top 10 position is on the line.`];return ['USEFUL MATCHUP',`This comparison will reduce uncertainty in your ranking.`]}
function renderArena(root){const s=state.session,a=s.pair[0],b=s.pair[1],r=reasonFor(s,a,b),rm=rankMap();root.innerHTML=`<div class="reason"><div class="reason-kicker">${r[0]}</div><div class="reason-copy">${esc(r[1])}</div></div><div class="duel-progress">Duel ${s.step} of ${s.target}</div><div class="duel-stage"><button class="duel-card" id="leftCard">${cardHtml(a,rm[a.id])}</button><div class="vs">VS</div><button class="duel-card" id="rightCard">${cardHtml(b,rm[b.id])}</button></div><div class="duel-actions"><button id="undoBtn" ${s.history.length?'':'disabled'}>Undo</button><button id="exitBtn">End session</button></div>`;$('leftCard').onclick=()=>choose(a,b);$('rightCard').onclick=()=>choose(b,a);$('undoBtn').onclick=undo;$('exitBtn').onclick=()=>{state.session=null;render()};}
function cardHtml(m,rank){const p=poster(m);return `${p?`<img src="${p}" alt="${esc(m.title)}">`:`<div class="poster-placeholder">${esc(m.title)}</div>`}<div class="card-meta"><div class="card-title">${esc(m.title)}</div><div class="card-sub">${esc(m.year||'—')}${m.director?' · '+esc(m.director):''}</div><div class="card-rank">#${rank||'—'} · ${Math.round(m.elo||1500)} Elo</div></div>`}
function choose(winner,loser){const s=state.session;const oldRanks=rankMap();const eW=1/(1+Math.pow(10,((loser.elo||1500)-(winner.elo||1500))/400));const eL=1-eW,K=48;const snap={wId:winner.id,lId:loser.id,wE:winner.elo,lE:loser.elo,logLen:state.duelLog.length,total:state.totalDuels,pair:[...s.pair],step:s.step};s.history.push(snap);winner.elo=(winner.elo||1500)+K*(1-eW);loser.elo=(loser.elo||1500)+K*(0-eL);state.duelLog.push({aId:winner.id,aTitle:winner.title,aEloBefore:snap.wE,bId:loser.id,bTitle:loser.title,bEloBefore:snap.lE,winnerId:winner.id,timestamp:Date.now()});state.totalDuels++;save();const newRanks=rankMap();if((oldRanks[winner.id]||999)>10&&(newRanks[winner.id]||999)<=10)showTop10(winner,oldRanks[winner.id],newRanks[winner.id]);state.lastResult={title:winner.title,win:true,delta:Math.round(winner.elo-snap.wE),rank:newRanks[winner.id]};s.step++;if(s.step>s.target){state.session=null;render();return}advancePair(winner,loser);render()}
function advancePair(winner,loser){const s=state.session;if(s.mode==='movie'){const focal=state.library.find(m=>m.id===s.focalId);s.pair=[focal,bestOpponentFor(focal)];return}let p=null;if(s.mode==='top10')p=pickTop10();else if(s.mode==='recent')p=pickRecent();else if(s.mode==='rivals')p=pickRival();else if(s.mode==='settle')p=pickSettle();else p=pickSmart();if(!p||p[0].id===p[1].id)p=pickRandomClose();s.pair=p}
function undo(){const s=state.session;if(!s||!s.history.length)return;const snap=s.history.pop();const w=state.library.find(m=>m.id===snap.wId),l=state.library.find(m=>m.id===snap.lId);if(w)w.elo=snap.wE;if(l)l.elo=snap.lE;state.duelLog.splice(snap.logLen);state.totalDuels=snap.total;s.pair=snap.pair;s.step=snap.step;state.lastResult=null;save();render()}
function showTop10(movie,from,to){$('top10Title').textContent=movie.title;$('top10Sub').textContent=`#${from} → #${to}`;const a=$('top10Alert');a.classList.add('show');setTimeout(()=>a.classList.remove('show'),3200)}
function renderRankings(){const root=$('rankView'),counts=duelCounts(),s=sortedLib();root.innerHTML=`<div class="block-head"><div><div class="kicker">Your canon</div><h2 class="section-title">RANKINGS</h2></div><p>${s.length} films</p></div><div class="rank-toolbar"><input id="rankSearch" placeholder="Search rankings"></div><div id="rankingList" class="ranking-list"></div>`;const draw=()=>{const q=$('rankSearch').value.trim().toLowerCase();$('rankingList').innerHTML=s.map((m,i)=>({m,i})).filter(x=>!q||x.m.title.toLowerCase().includes(q)||(x.m.director||'').toLowerCase().includes(q)).map(({m,i})=>`<div class="rank-row ${i<10?'top':''}"><div class="rank-num">${String(i+1).padStart(2,'0')}</div><div><div class="rank-title">${esc(m.title)}</div><div class="rank-sub">${esc(m.year||'—')}${m.director?' · '+esc(m.director):''}</div></div><div class="rank-stats"><div class="rank-rating">${Math.round(m.elo||1500)}</div><div class="rank-duels">${counts[m.id]||0} duel${(counts[m.id]||0)===1?'':'s'}</div></div><button class="rank-btn" data-id="${m.id}">Rank this movie →</button></div>`).join('')||'<div class="empty">No matches.</div>';root.querySelectorAll('.rank-btn').forEach(b=>b.onclick=()=>{const m=state.library.find(x=>x.id==b.dataset.id);show('duel');startMovieMode(m)})};draw();$('rankSearch').oninput=draw}
function renderLibrary(){const root=$('libraryView');root.innerHTML=`<div class="block-head"><div><div class="kicker">Add or place</div><h2 class="section-title">LIBRARY</h2></div></div><div class="search-row"><input id="movieSearch" placeholder="I watched something…"><button id="movieSearchBtn">Search</button></div><div id="searchStatus" class="status"></div><div id="searchResults" class="search-results"></div>${state.library.length?`<div class="block"><div class="kicker">Needs more evidence</div><div class="library-list">${uncertainMovies().slice(0,6).map(x=>`<div class="library-row"><div><b>${esc(x.m.title)}</b><br><span>${x.c}% confidence · ${Math.round(x.m.elo)} Elo</span></div><button data-place="${x.m.id}">Place movie</button></div>`).join('')}</div></div>`:''}`;$('movieSearchBtn').onclick=searchMovies;$('movieSearch').onkeydown=e=>{if(e.key==='Enter')searchMovies()};root.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{const m=state.library.find(x=>x.id==b.dataset.place);show('duel');startMovieMode(m)})}
async function searchMovies(){const q=$('movieSearch').value.trim();if(!q)return;$('searchStatus').textContent='Searching…';$('searchResults').innerHTML='';try{const res=await fetch(`${PROXY}/search/movie?api_key=proxy&query=${encodeURIComponent(q)}&include_adult=false`);const data=await res.json();$('searchStatus').textContent='';$('searchResults').innerHTML=(data.results||[]).slice(0,12).map(m=>{const exists=state.library.some(x=>x.id===m.id);const p=m.poster_path?`https://image.tmdb.org/t/p/w342${m.poster_path}`:'';return `<button class="search-card" data-id="${m.id}" ${exists?'disabled':''}>${p?`<img src="${p}" alt="${esc(m.title)}">`:`<div class="poster-placeholder">${esc(m.title)}</div>`}<div class="sm"><b>${esc(m.title)}</b><span>${(m.release_date||'').slice(0,4)||'—'}${exists?' · already ranked':''}</span></div></button>`}).join('');$('searchResults').querySelectorAll('[data-id]:not([disabled])').forEach(b=>b.onclick=()=>addMovieFromSearch((data.results||[]).find(m=>m.id==b.dataset.id)))}catch(e){$('searchStatus').textContent='Search failed. Try again.'}}
async function addMovieFromSearch(m){$('searchStatus').textContent=`Loading ${m.title}…`;let details={};try{const r=await fetch(`${PROXY}/movie/${m.id}?api_key=proxy&append_to_response=credits`);const d=await r.json();const director=(d.credits?.crew||[]).find(c=>c.job==='Director');details={runtime:d.runtime||null,director:director?.name||null}}catch(e){}const movie={id:m.id,title:m.title,year:(m.release_date||'').slice(0,4)||'—',poster_path:m.poster_path,elo:1500,genres:m.genre_ids||[],tmdbRating:typeof m.vote_average==='number'?m.vote_average:null,addedAt:Date.now(),rerankCount:0,...details};state.library.push(movie);save();$('searchStatus').textContent='';show('duel');startMovieMode(movie)}
function openMoviePicker(){$('pickerTitle').textContent='Rank a Movie';$('pickerDesc').textContent='Choose the film you want Duel Cut to place more precisely.';$('pickerList').innerHTML=sortedLib().map(m=>`<button data-id="${m.id}"><b>${esc(m.title)}</b><br><span class="muted">${esc(m.year||'—')} · ${confidenceFor(m)}% confidence</span></button>`).join('');$('moviePicker').classList.remove('hidden');$('pickerList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const m=state.library.find(x=>x.id==b.dataset.id);$('moviePicker').classList.add('hidden');startMovieMode(m)})}
load();
</script>
